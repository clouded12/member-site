version: '3.8'

services:
  nextjs-app:
    container_name: nextjs-dev
    build:
      context: .
      dockerfile: Dockerfile
    ports:
    - '3000:3000'
    volumes:
    - .:/app
    - /app/node_modules # コンテナ内の node_modules をマウントしない
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/mydb
      REDIS_URL: redis://redis:6379
    command: npm run dev
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis-server
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:      