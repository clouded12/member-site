version: '3.8'

services:
  nextjs-app:
    container_name: nextjs-dev
    build:
      context: .
      dockerfile: Dockerfile
    ports:
    - '3000:3000'
    volumes:
    - .:/app
    - /app/node_modules # コンテナ内の node_modules をマウントしない
    environment:
      NODE_ENV: development
    command: npm run dev
